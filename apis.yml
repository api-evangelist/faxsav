name: FaxSav
description: >-
  FaxSav Incorporated was an Edison, New Jersey internet-fax company that
  designed, developed and marketed store-and-forward and real-time fax
  transmission services over a hybrid telephony and Internet network, letting
  customers bypass international long-distance rates. Its products included the
  faxLauncher Windows desktop client, the faxMailer email-to-fax service built
  on the company's patented e-mail security technology, and Serverlink, a
  partner integration that let third-party fax software and application
  developers route documents through the FaxSav Network. FaxSav went public in
  1996, renamed itself NetMoves Corporation in February 1999, and was acquired
  by Mail.com, Inc. in early 2000; Mail.com became EasyLink Services
  Corporation in 2001 and the business was acquired by OpenText in 2012. The
  company is defunct and operates no API, developer program, or public
  developer portal today. This profile is retained as a historical record.

summary: >-
  FaxSav Incorporated no longer exists as an operating company. It was an
  Edison, New Jersey internet-fax provider that IPO'd in 1996, renamed itself
  NetMoves Corporation in February 1999, and was acquired by Mail.com, Inc. in
  early 2000. Mail.com renamed itself EasyLink Services Corporation in April
  2001, and the EasyLink business was acquired by OpenText in 2012. There is no
  current FaxSav product, developer program, or API surface.
